[project]
name = "tizen-iptv-relay"
version = "0.1.0"
description = "LAN relay for the Tizen IPTV remote"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<0.121",
    "orjson>=3.10",
]

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "httpx>=0.28",
    "httpx2[http2,brotli,zstd]>=0.1",
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
pythonPlatform = "All"
include = ["remote_server.py", "remote_store.py", "remote_models.py", "remote_static.py", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
reportUnusedCallResult = "warning"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py313"
line-length = 88
src = [".", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001", "FBT001", "FBT002"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
